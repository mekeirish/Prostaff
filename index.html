function fxGetContext() {
    if (!fxState.ctx) {
        const AC = window.AudioContext || window.webkitAudioContext;
        if (!AC) return null;
        try {
            fxState.ctx = new AC();
        } catch (e) {
            return null;
        }
    }
    if (fxState.ctx.state === 'suspended') {
        fxState.ctx.resume().catch(() => {});
    }
    return fxState.ctx;
}
function fxTone(ctx, t) {
    const now = ctx.currentTime + (t.at || 0);
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    const vol = t.vol || 0.08;

    osc.type = t.type || 'sine';
    osc.frequency.setValueAtTime(t.freq, now);
    if (t.to) osc.frequency.exponentialRampToValueAtTime(t.to, now + t.dur);

    gain.gain.setValueAtTime(0.0001, now);
    gain.gain.exponentialRampToValueAtTime(vol, now + 0.012);
    gain.gain.exponentialRampToValueAtTime(0.0001, now + t.dur);

    osc.connect(gain);
    gain.connect(ctx.destination);
    osc.start(now);
    osc.stop(now + t.dur + 0.03);
}
// Joue le son + la vibration associés à un événement
function feedback(name) {
    if (!fxState.sound) return;

    const vib = FX_HAPTICS[name];
    if (vib && navigator.vibrate) {
        try { navigator.vibrate(vib); } catch (e) {}
    }

    const tones = FX_SOUNDS[name];
    if (!tones) return;
    const ctx = fxGetContext();
    if (!ctx) return;
    tones.forEach(t => fxTone(ctx, t));
}

function initFeedback() {
    // Débloque l'audio dès le premier geste (exigé par les navigateurs)
    document.addEventListener('pointerdown', () => { fxGetContext(); }, { once: true, passive: true });

    // Micro "tick" à chaque appui sur un bouton
    document.addEventListener('pointerdown', (e) => {
        const btn = e.target.closest ? e.target.closest('button') : null;
        if (!btn || btn.disabled || btn.id === 'soundToggle') return;
        const now = Date.now();
        if (now - fxState.lastTick < 60) return;
        fxState.lastTick = now;
        feedback('tick');
    }, { passive: true });

    // Sons d'ouverture / fermeture des fenêtres modales
    const observer = new MutationObserver((mutations) => {
        mutations.forEach(m => {
            const el = m.target;
            if (!el.id || !el.id.startsWith('modal')) return;
            const wasHidden = (m.oldValue || '').split(/\s+/).includes('hidden');
            const isHidden = el.classList.contains('hidden');
            if (wasHidden === isHidden) return;
            if (isHidden) {
                if (Date.now() - fxState.lastToast > 300) feedback('close');
            } else {
                feedback('open');
            }
        });
    });
    document.querySelectorAll('[id^="modal"]').forEach(el => {
        observer.observe(el, { attributes: true, attributeFilter: ['class'], attributeOldValue: true });
    });

    // Synchronisation entre onglets : une mission acceptée déclenche la notification
    window.addEventListener('storage', (e) => {
        if (e.key !== 'prostaff_missions' || !e.newValue) return;
        try {
            state.missions = JSON.parse(e.newValue) || state.missions;
            render();
        } catch (err) {}
    });
}

const container = document.getElementById('toastContainer');
const toast = document.createElement('div');

const toastStyles = {
    success: { cls: 'toast-success', icon: 'check-circle-2', sound: 'success' },

    info: { cls: 'toast-info', icon: 'info', sound: 'info' }
};
const ts = toastStyles[type] || toastStyles.info;

toast.className = `toast-item ${ts.cls} pointer-events-auto animate-toast`;
toast.innerHTML = `<i data-lucide="${ts.icon}" class="w-4 h-4 shrink-0"></i><span>${message}</span><span class="toast-bar"></span>`;

container.appendChild(toast);
lucide.createIcons();

fxState.lastToast = Date.now();
feedback(fxState.nextSound || ts.sound);
fxState.nextSound = null;
            setTimeout(() => {
                toast.style.opacity = '0';
                toast.style.transition = 'opacity 0.3s ease-out';
                setTimeout(() => toast.remove(), 300);
            }, 3000);
        }

function formatDateBrief(dateStr) {
    if (!dateStr) return '';
    // Take the first segment before " | " if present (multi-day), else the whole string
    const first = dateStr.split('|')[0].trim();
    // Extract weekday/date + time range
    const match = first.match(/^([^\d]+?)\s*(\d{1,2})[^\d]*?(\d{1,2}[:hH]\d{0,2})\s*[-–]\s*(\d{1,2}[:hH]\d{0,2})$/);
    if (match) {
        const dayLabel = match[1].trim();
        const start = match[3].replace('h', ':').replace(':00', 'h');
        const end = match[4].replace('h', ':').replace(':00', 'h');
        return `${dayLabel} ${start}-${end}`;
    }
    // Multi-day: show count
    const parts = dateStr.split('|');
    if (parts.length > 1) {
        return `${parts.length} jours sélectionnés`;
    }
    return first;
}
// Parses the m.date string into individual entries: { dateLabel, start, end }
function parseScheduleEntries(dateStr) {
    if (!dateStr) return [];
    const parts = dateStr.split('|').map(s => s.trim()).filter(Boolean);
    return parts.map(part => {
        // Format expected: "DD/MM HH:MM-HH:MM" or "Vendredi 19h - 00h"
        const m1 = part.match(/^(\d{1,2}\/\d{1,2})\s+(\d{1,2}[:h]\d{0,2})\s*[-–]\s*(\d{1,2}[:h]\d{0,2})$/);
        if (m1) {
            return { dateLabel: m1[1], start: m1[2].replace('h', 'h'), end: m1[3].replace('h', 'h') };
        }
        const m2 = part.match(/^(.+?)\s+(\d{1,2}[:h]\d{0,2})\s*[-–]\s*(\d{1,2}[:h]\d{0,2})$/);
        if (m2) {
            return { dateLabel: m2[1].trim(), start: m2[2].replace('h', 'h'), end: m2[3].replace('h', 'h') };
        }
        return { dateLabel: part, start: '', end: '' };
    });
}
// Compact display: "Du 12/11 au 15/11 • 09h-17h" or single-day "Vendredi • 19h-00h"
function formatScheduleRange(dateStr) {
    const entries = parseScheduleEntries(dateStr);
    if (entries.length === 0) return '';
    if (entries.length === 1) {
        const e = entries[0];
        return `${e.dateLabel} • ${e.start}-${e.end}`;
    }
    const first = entries[0];
    const last = entries[entries.length - 1];
    // If same start/end hours for all entries, show a single time range
    const sameHours = entries.every(e => e.start === first.start && e.end === first.end);
    if (sameHours) {
        return `Du ${first.dateLabel} au ${last.dateLabel} • ${first.start}-${first.end}`;
    }
    return `Du ${first.dateLabel} au ${last.dateLabel} • horaires variables`;
}
// Computes total hours from m.date entries. Handles overnight (end < start).
// Returns { perDay: [{label, start, end, hours}], totalHours }
function computeMissionHours(dateStr) {
    if (!dateStr) return { perDay: [], totalHours: 0 };
    const entries = parseScheduleEntries(dateStr);
    const toMin = (t) => {
        if (!t) return null;
        // Normalize: "09h", "09:00", "9h30", "9:30"
        let clean = String(t).trim().toLowerCase();
        clean = clean.replace('h', ':');
        if (/^\d{1,2}$/.test(clean)) clean += ':00';       // "09" -> "09:00"
        if (/^\d{1,2}:$/.test(clean)) clean += '00';       // "09:" -> "09:00"
        if (/^\d{1,2}:\d{1}$/.test(clean)) clean = clean.replace(/:(\d)$/, ':0$1');
        const parts = clean.split(':');
        const h = parseInt(parts[0], 10);
        const m = parseInt(parts[1] || '0', 10);
        if (isNaN(h)) return null;
        return h * 60 + (isNaN(m) ? 0 : m);
    };
    const perDay = entries.map(e => {
        const s = toMin(e.start);
        const en = toMin(e.end);
        let hours = 0;
        if (s != null && en != null) {
            let diff = en - s;
            if (diff < 0) diff += 24 * 60; // overnight
            hours = diff / 60;
        }
        return { label: e.dateLabel, start: e.start, end: e.end, hours };
    });
    const totalHours = perDay.reduce((acc, d) => acc + d.hours, 0);
    return { perDay, totalHours };
}
// Returns effective hours for a mission: prefer manual m.hours if valid, else compute from m.date
function getMissionHours(m) {
    if (!m) return 0;
    const manual = Number(m.hours);
    if (!isNaN(manual) && manual > 0) return manual;
    // Recompute from date if manual hours are missing/zero/invalid
    if (!m.date) return 0;
    const { totalHours } = computeMissionHours(m.date);
    return Math.round(totalHours * 100) / 100;
}
// Returns effective total pay = hourlyRate * hours.
// Falls back to parsing m.pay ("500 DZD/h") if hourlyRate missing.
function getMissionTotal(m) {
    if (!m) return 0;
    const hours = getMissionHours(m);
    let rate = Number(m.hourlyRate);
    if (isNaN(rate) || rate <= 0) {
        // Try to parse from m.pay, e.g. "500 DZD/h"
        if (typeof m.pay === 'string') {
            const parsed = parseFloat(m.pay.replace(',', '.'));
            if (!isNaN(parsed) && parsed > 0) rate = parsed;
        }
    }
    if (!hours || !rate || isNaN(rate)) return 0;
    return Math.round(hours * rate * 100) / 100;
}

function renderCalendar() {
    const grid = document.getElementById('calendarGrid');
    const label = document.getElementById('calendarMonthLabel');
    if (!grid || !label) return;

    const monthNames = ['Janvier','Février','Mars','Avril','Mai','Juin','Juillet','Août','Septembre','Octobre','Novembre','Décembre'];
    label.textContent = `${monthNames[calendarState.month]} ${calendarState.year}`;

    const firstDay = new Date(calendarState.year, calendarState.month, 1);
    const daysInMonth = new Date(calendarState.year, calendarState.month + 1, 0).getDate();
    // Monday = 0 index
    let startOffset = firstDay.getDay() - 1;
    if (startOffset < 0) startOffset = 6;

    const today = new Date();
    today.setHours(0, 0, 0, 0);

    let html = '';
    for (let i = 0; i < startOffset; i++) {
        html += `<span></span>`;
    }
    for (let d = 1; d <= daysInMonth; d++) {
        const dateObj = new Date(calendarState.year, calendarState.month, d);
        const iso = `${calendarState.year}-${String(calendarState.month + 1).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
        const isPast = dateObj < today;
        const isSelected = calendarState.selectedDays.some(sd => sd.date === iso);

        let cls = 'h-8 rounded-lg text-xs font-semibold transition-all flex items-center justify-center ';
        if (isPast) {
            cls += 'text-cyber-muted/30 cursor-not-allowed';
        } else if (isSelected) {
            cls += 'bg-cyber-accent text-white border border-cyber-accent';
        } else {
            cls += 'bg-cyber-surface text-cyber-text border border-cyber-border hover:border-cyber-accent/60';
        }

        if (isPast) {
            html += `<button type="button" class="${cls}" disabled>${d}</button>`;
        } else {
            html += `<button type="button" class="${cls}" onclick="toggleCalendarDay('${iso}')">${d}</button>`;
        }
    }
    grid.innerHTML = html;
    renderSelectedDaysSummary();
    lucide.createIcons();
}

                <div class="space-y-2">
                    <h2 class="hero-title font-extrabold tracking-tight">Prostaff</h2>
                    <p class="text-xs text-cyber-muted max-w-[270px] mx-auto leading-relaxed">La plateforme qui connecte les professionnels et les entreprises pour des missions rapides et bien rémunérées.</p>
                </div>
                <div class="flex flex-wrap justify-center gap-2 max-w-[300px]">
                    <span class="hero-chip"><i data-lucide="zap" class="w-3.5 h-3.5 text-cyber-accent"></i> Missions express</span>
                    <span class="hero-chip"><i data-lucide="check-circle-2" class="w-3.5 h-3.5 text-cyber-accent"></i> Candidature en 1 clic</span>
                    <span class="hero-chip"><i data-lucide="users" class="w-3.5 h-3.5 text-cyber-accent"></i> Suivi des candidatures</span>
                </div>
                <button onclick="openLoginModal()" class="btn-primary px-6 py-3 rounded-2xl text-sm flex items-center gap-2">
                    <i data-lucide="log-in" class="w-4 h-4"></i> Se connecter
                </button>
            </div>
        `;
        lucide.createIcons();
        return;
    }

    let baseMissions = state.missions;
    if (state.role === 'employer') {
        baseMissions = state.missions.filter(m => m.employerId === state.currentUserId);
    } else {
        baseMissions = state.missions.filter(m => !isMissionIgnored(m.id));
    }
    const filteredMissions = state.activeCategory === 'TOUS'
        ? baseMissions
        : baseMissions.filter(m => m.category === state.activeCategory);

    const me = state.role === 'candidate' ? getCurrentCandidate() : getCurrentEmployer();

    if (state.activeTab === 'feed') {
        const hour = new Date().getHours();
        const greeting = hour < 12 ? 'Bonjour' : (hour < 18 ? 'Bon après-midi' : 'Bonsoir');
        const kpi = (value, label, color) => `
            <div class="kpi">
                <p class="kpi-value ${color}">${value}</p>
                <p class="kpi-label">${label}</p>
            </div>
        `;
        const myAppsCount = state.missions.filter(m => m.applicants.some(a => a.id === state.currentUserId)).length;
        const myAcceptedCount = state.missions.filter(m => m.applicants.some(a => a.id === state.currentUserId && a.status === 'accepted')).length;
        const receivedTotal = baseMissions.reduce((n, m) => n + m.applicants.length, 0);
        const hiredTotal = baseMissions.reduce((n, m) => n + m.applicants.filter(a => a.status === 'accepted').length, 0);

        app.innerHTML = `
            <div class="space-y-4">
                ${state.role === 'candidate' ? `
                    <div class="cyber-card rounded-2xl p-3.5 space-y-3 relative overflow-hidden card-enter">
                        <span class="accent-line"></span>
                        <div class="flex items-center justify-between gap-2">
                            <div class="flex items-center gap-3 min-w-0">
                                <div class="avatar-ring shrink-0">
                                    <div class="w-11 h-11 flex items-center justify-center font-extrabold text-cyber-accent text-base">
                                        ${me.name.charAt(0)}
                                    </div>
                                </div>
                                <div class="min-w-0">
                                    <p class="text-[11px] text-cyber-muted">${greeting}</p>
                                    <p class="text-sm font-bold text-white truncate">${me.name}</p>
                                    <p class="text-xs text-cyber-accent font-semibold truncate">${me.rate || 'Tarif non renseigné'}</p>
                                </div>
                            </div>
                            <button onclick="openProfileModal()" class="btn-ghost px-2.5 py-1.5 rounded-lg text-xs flex items-center gap-1 shrink-0">
                                <i data-lucide="edit-3" class="w-3.5 h-3.5"></i> Modifier
                            </button>
                        </div>
                        <div class="grid grid-cols-3 gap-2">
                            ${kpi(baseMissions.length, 'Missions', 'text-white')}
                            ${kpi(myAppsCount, 'Postulées', 'text-cyber-accent')}
                            ${kpi(myAcceptedCount, 'Retenues', 'text-cyber-success')}
                        </div>
                    </div>
                ` : `
                    <div class="cyber-card rounded-2xl p-3.5 space-y-3 relative overflow-hidden card-enter">
                        <span class="accent-line"></span>
                        <div class="flex items-center gap-3 min-w-0">
                            <div class="avatar-ring shrink-0">
                                <div class="w-11 h-11 flex items-center justify-center text-cyber-accent">
                                    <i data-lucide="briefcase" class="w-5 h-5"></i>
                                </div>
                            </div>
                            <div class="min-w-0">
                                <p class="text-[11px] text-cyber-muted">${greeting}</p>
                                <p class="text-sm font-bold text-white truncate">${me.name}</p>
                            </div>
                        </div>
                        <div class="grid grid-cols-3 gap-2">
                            ${kpi(baseMissions.length, 'Annonces', 'text-white')}
                            ${kpi(receivedTotal, 'Candidats', 'text-cyber-accent')}
                            ${kpi(hiredTotal, 'Retenus', 'text-cyber-success')}
                        </div>
                    </div>
                    <button onclick="openModal()" class="btn-primary w-full py-3 rounded-xl flex items-center justify-center gap-2 text-sm">
                        <i data-lucide="plus-circle" class="w-4 h-4"></i> Créer une nouvelle mission
                    </button>
                `}

                <div class="flex space-x-2 overflow-x-auto hide-scrollbar py-1">
                    ${categories.map(cat => `
                        <button onclick="setCategoryFilter('${cat}')" class="px-3.5 py-1.5 rounded-full text-xs font-semibold whitespace-nowrap transition-all ${state.activeCategory === cat ? 'bg-cyber-accent text-white border border-cyber-accent shadow-lg shadow-cyber-accent/25' : 'bg-cyber-surface text-cyber-muted border border-cyber-border hover:text-white hover:border-cyber-accent/50'}">
                            ${cat}
                        </button>
                    `).join('')}
                </div>

                ${filteredMissions.length === 0 ? `
                    <div class="cyber-card rounded-2xl p-6 text-center text-cyber-muted space-y-2 card-enter">
                        <i data-lucide="inbox" class="w-8 h-8 mx-auto opacity-50"></i>
                        <p class="text-xs">Aucune mission disponible dans cette catégorie.</p>
                    </div>
                ` : filteredMissions.map((m, i) => {
                    const delay = Math.min(i, 8) * 70;
                    if (state.role === 'candidate') {
                        const myApplication = m.applicants.find(a => a.id === state.currentUserId);
                        const hours = getMissionHours(m);
                        const total = getMissionTotal(m);
                        const scheduleBrief = formatScheduleRange(m.date);
                        const code = m.code || m.id.toUpperCase();
                        const distance = m.distanceKm != null ? `${m.distanceKm} km` : '';
                        const address = m.address || m.location || '';
                        return `
                            <div class="cyber-card rounded-2xl p-3.5 space-y-2.5 flex flex-col min-h-[250px] relative overflow-hidden card-enter" style="animation-delay:${delay}ms">
                                <span class="accent-line"></span>
                                <div class="flex items-center justify-between gap-2">
                                    <span class="code-badge">${code}</span>
                                    <span class="${getCategoryBadgeClass(m.category)}">${m.category || 'Général'}</span>
                                </div>

                                <div class="min-w-0">
                                    <h3 class="font-extrabold text-sm text-white leading-tight truncate">${m.title}</h3>
                                    <p class="text-xs font-medium text-cyber-muted truncate">${m.company}</p>
                                </div>

                                <div class="space-y-1 text-xs text-cyber-muted">
                                    <button type="button" onclick="openInGoogleMaps('${address.replace(/'/g, "\\'")}')" class="flex items-center gap-1.5 min-w-0 w-full text-left hover:text-cyber-accent transition-colors">
                                        <i data-lucide="map-pin" class="w-3.5 h-3.5 shrink-0 text-cyber-accent"></i>
                                        <span class="truncate underline decoration-dotted underline-offset-2">${address}</span>
                                    </button>
                                    <div class="flex items-center gap-1.5">
                                        <i data-lucide="navigation" class="w-3.5 h-3.5 shrink-0 text-cyber-accent"></i>
                                        <span>${distance || '—'}</span>
                                    </div>
                                    <button type="button" onclick="openScheduleDetail('${m.id}')" class="flex items-center gap-1.5 text-left hover:text-cyber-accent transition-colors min-w-0 w-full">
                                        <i data-lucide="clock" class="w-3.5 h-3.5 shrink-0 text-cyber-accent"></i>
                                        <span class="truncate underline decoration-dotted underline-offset-2">${scheduleBrief}</span>
                                    </button>
                                </div>

                                <div class="grid grid-cols-3 gap-1.5 pt-1">
                                    <div class="stat-box">
                                        <p class="stat-label">Tarif</p>
                                        <p class="stat-value stat-value-pay">${m.pay || (m.hourlyRate ? m.hourlyRate + ' DZD/h' : '—')}</p>
                                    </div>
                                    <div class="stat-box">
                                        <p class="stat-label">Durée</p>
                                        <p class="stat-value stat-value-hours">${hours ? hours + 'h' : '—'}</p>
                                    </div>
                                    <div class="stat-box">
                                        <p class="stat-label">Total</p>
                                        <p class="stat-value stat-value-total">${total ? total + ' DZD' : '—'}</p>
                                    </div>
                                </div>

                                <div class="pt-1.5 mt-auto">
                                    ${myApplication ? `
                                        <span class="w-full text-center py-2 text-xs font-medium rounded-xl border ${getStatusBadgeClass(myApplication.status)} flex items-center justify-center gap-1.5">
                                            <i data-lucide="check-circle-2" class="w-3.5 h-3.5"></i> ${getStatusLabel(myApplication.status)}
                                        </span>
                                    ` : `
                                        <div class="grid grid-cols-2 gap-2">
                                            <button onclick="ignoreMission('${m.id}')" class="btn-ghost py-2 rounded-xl text-xs flex items-center justify-center gap-1">
                                                <i data-lucide="x" class="w-3.5 h-3.5"></i> Ignorer
                                            </button>
                                            <button onclick="applyToMission('${m.id}')" class="btn-primary py-2 rounded-xl text-xs flex items-center justify-center gap-1">
                                                <i data-lucide="check" class="w-3.5 h-3.5"></i> Disponible
                                            </button>
                                        </div>
                                    `}
                                </div>
                            </div>
                        `;
                    }
                    const hours = getMissionHours(m);
                    const total = getMissionTotal(m);
                    const employerAddress = m.address || m.location || '';
                    return `
                        <div class="cyber-card rounded-2xl p-3.5 space-y-2.5 relative overflow-hidden card-enter" style="animation-delay:${delay}ms">
                            <span class="accent-line"></span>
                            <div class="flex items-start justify-between gap-2">
                                <div class="min-w-0">
                                    <span class="${getCategoryBadgeClass(m.category)} mb-1">${m.category || 'Général'}</span>
                                    <h3 class="font-extrabold text-sm text-white leading-tight truncate">${m.title}</h3>
                                    <p class="text-xs font-medium text-cyber-muted truncate">${m.company}</p>
                                </div>
                                <span class="px-2 py-1 bg-cyber-accent/10 border border-cyber-accent/30 rounded-lg text-xs font-extrabold text-cyber-accent shrink-0">
                                    ${m.pay}
                                </span>
                            </div>

                            <div class="grid grid-cols-2 gap-2 text-xs text-cyber-muted pt-1">
                                <button type="button" onclick="openInGoogleMaps('${employerAddress.replace(/'/g, "\\'")}')" class="flex items-center gap-1.5 min-w-0 text-left hover:text-cyber-accent transition-colors">
                                    <i data-lucide="map-pin" class="w-3.5 h-3.5 shrink-0 text-cyber-accent"></i>
                                    <span class="truncate underline decoration-dotted underline-offset-2">${m.location}</span>
                                </button>
                                <div class="flex items-center gap-1.5 min-w-0">
                                    <i data-lucide="clock" class="w-3.5 h-3.5 shrink-0 text-cyber-accent"></i>
                                    <span class="truncate">${m.date}</span>
                                </div>
                            </div>

                            <div class="grid grid-cols-3 gap-1.5">
                                <div class="stat-box">
                                    <p class="stat-label">Tarif</p>
                                    <p class="stat-value stat-value-pay">${m.pay || (m.hourlyRate ? m.hourlyRate + ' DZD/h' : '—')}</p>
                                </div>
                                <div class="stat-box">
                                    <p class="stat-label">Durée</p>
                                    <p class="stat-value stat-value-hours">${hours ? hours + 'h' : '—'}</p>
                                </div>
                                <div class="stat-box">
                                    <p class="stat-label">Total</p>
                                    <p class="stat-value stat-value-total">${total ? total + ' DZD' : '—'}</p>
                                </div>
                            </div>

                            <p class="text-xs text-cyber-text/80 line-clamp-2">${m.description}</p>

                            <div class="pt-2 border-t border-cyber-border/50">
                                <button onclick="openApplicantsModal('${m.id}')" class="btn-ghost w-full py-2 rounded-xl text-xs flex items-center justify-center gap-2">
                                    <i data-lucide="users" class="w-3.5 h-3.5 text-cyber-accent"></i>
                                    Voir les candidats (${m.applicants.length})
                                </button>
                            </div>
                        </div>
                    `;
                }).join('')}
            </div>
        `;
    }

    if (state.activeTab === 'my-space') {
        if (state.role === 'candidate') {
            const myAppliedMissions = state.missions.filter(m => m.applicants.some(a => a.id === state.currentUserId));
            app.innerHTML = `
                <div class="space-y-3">
                    <h2 class="text-xs font-bold text-cyber-muted tracking-wider uppercase">Suivi de mes postulations (${myAppliedMissions.length})</h2>
                    ${myAppliedMissions.length === 0 ? `
                        <div class="cyber-card rounded-2xl p-6 text-center text-cyber-muted space-y-2 card-enter">
                            <i data-lucide="send" class="w-8 h-8 mx-auto opacity-50"></i>
                            <p class="text-xs">Vous n'avez pas encore postulé à une mission.</p>
                        </div>
                    ` : myAppliedMissions.map((m, i) => {
                        const appInfo = m.applicants.find(a => a.id === state.currentUserId);
                        return `
                            <div class="cyber-card rounded-2xl p-3.5 space-y-2.5 relative overflow-hidden card-enter" style="animation-delay:${Math.min(i, 8) * 70}ms">
                                <span class="accent-line"></span>
                                <div class="flex justify-between items-start gap-2">
                                    <div class="min-w-0">
                                        <h3 class="font-extrabold text-sm text-white truncate">${m.title}</h3>
                                        <p class="text-xs text-cyber-accent truncate">${m.company}</p>
                                    </div>
                                    <span class="text-xs font-medium px-2 py-1 rounded-lg shrink-0 ${getStatusBadgeClass(appInfo.status)}">
                                        ${getStatusLabel(appInfo.status)}
                                    </span>
                                </div>
                                <div class="text-xs text-cyber-muted space-y-1">
                                    <p><strong class="text-cyber-text">Date:</strong> ${m.date}</p>
                                    <p><strong class="text-cyber-text">Lieu:</strong> ${m.location}</p>
                                    <p><strong class="text-cyber-text">Paye:</strong> ${m.pay}</p>
                                </div>
                            </div>
                        `;
                    }).join('')}
                </div>
            `;
        } else {
            const myMissions = state.missions.filter(m => m.employerId === state.currentUserId);
            app.innerHTML = `
                <div class="space-y-3">
                    <h2 class="text-xs font-bold text-cyber-muted tracking-wider uppercase">Mes annonces publiées</h2>
                    ${myMissions.length === 0 ? `
                        <div class="cyber-card rounded-2xl p-6 text-center text-cyber-muted space-y-2 card-enter">
                            <i data-lucide="clipboard-list" class="w-8 h-8 mx-auto opacity-50"></i>
                            <p class="text-xs">Vous n'avez pas encore créé d'offres.</p>
                        </div>
                    ` : myMissions.map((m, i) => {
                        const hours = getMissionHours(m);
                        const total = getMissionTotal(m);
                        return `
                            <div class="cyber-card rounded-2xl p-3.5 space-y-2.5 relative overflow-hidden card-enter" style="animation-delay:${Math.min(i, 8) * 70}ms">
                                <span class="accent-line"></span>
                                <div class="flex justify-between items-start gap-2">
                                    <div class="min-w-0">
                                        <h3 class="font-extrabold text-sm text-white truncate">${m.title}</h3>
                                        <p class="text-xs text-cyber-muted truncate">${m.location} • ${m.pay}</p>
                                    </div>
                                    <span class="px-2 py-0.5 bg-cyber-accent/10 border border-cyber-accent/30 rounded text-[10px] text-cyber-accent font-bold shrink-0">
                                        ${m.applicants.length} cand.
                                    </span>
                                </div>
                                <div class="grid grid-cols-3 gap-1.5">
                                    <div class="stat-box">
                                        <p class="stat-label">Tarif</p>
                                        <p class="stat-value stat-value-pay">${m.pay || (m.hourlyRate ? m.hourlyRate + ' DZD/h' : '—')}</p>
                                    </div>
                                    <div class="stat-box">
                                        <p class="stat-label">Durée</p>
                                        <p class="stat-value stat-value-hours">${hours ? hours + 'h' : '—'}</p>
                                    </div>
                                    <div class="stat-box">
                                        <p class="stat-label">Total</p>
                                        <p class="stat-value stat-value-total">${total ? total + ' DZD' : '—'}</p>
                                    </div>
                                </div>
                                <button onclick="openApplicantsModal('${m.id}')" class="btn-primary w-full py-2 rounded-xl text-xs">
                                    Gérer les sélections
                                </button>
                            </div>
                        `;
                    }).join('')}
                </div>
            `;
        }
    }

    lucide.createIcons();
}

// --- INIT ---
(function init() {
    // Restore theme early
    initTheme();

    // Restore session if any
    try {
        const session = JSON.parse(localStorage.getItem('prostaff_session'));
        if (session && session.userId) {
            state.role = session.role;
            state.currentUserId = session.userId;
        }
    } catch (e) {}

    renderAuthZone();
    renderCalendar();
    initFeedback();

    // Login code input: allow Enter to submit
    const codeInput = document.getElementById('inputLoginCode');
    if (codeInput) {
        codeInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') {
                e.preventDefault();
                submitLoginCode();
            }
        });
    }

    render();
})();
    </script>
<script>
if ('serviceWorker' in navigator) {
window.addEventListener('load',()=>{
navigator.serviceWorker.register('./sw.js').catch(err=>console.error(err));
});
}
</script>
</body>
</html>
